# ============================================================================
# dbt Project Configuration - Cooke Inc. Data Services
# ============================================================================
# Analytics platform for Cooke Inc., transforming raw Snowflake data into
# curated datasets for reporting, analytics, reverse ETL, and data science.
# ============================================================================

name: "cookedbt"
version: "1.0.0"
config-version: 2

# This setting configures which profile dbt uses for this project
profile: "default"

# Directory paths for different file types
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
packages-install-path: "dbt_pkgs"

clean-targets:
  - "target"
  - "dbt_pkgs"

flags:
  indirect_selection: cautious

# ============================================================================
# Global Model Configuration
# ============================================================================

models:
  +copy_grants: true
  +on_schema_change: "sync_all_columns"
  +persist_docs:
    relation: true
    columns: true

  cookedbt:
    # ========================================================================
    # INTERMEDIATE LAYER
    # ========================================================================

    intermediate:
      d365:
        +materialized: view
        +tags: ["Finops", "D365", "Global Sales", "Business Analytics & Enablement"]

      kontali:
        +materialized: view
        +tags: ["kontali"]

      d365-crm:
        +materialized: view
        +tags: ["D365-CRM", "Global_Sales"]

      cpm:
        fishtalk:
          +materialized: view
          +tags: ["CPM", "Onestream", "CPM-Onestream", "Fishtalk"]

      fishtalk:
        +materialized: view
        +tags: ["Fishtalk"]

    # ========================================================================
    # DATA ENGINEERING TEAM VIEWS LAYER
    # ========================================================================

    de_views:
      d365-cpm:
        +materialized: view
        +secure: true
        +schema: d365

    # ========================================================================
    # MARTS LAYER
    # ========================================================================

    marts:
      ancillary:
        +materialized: table
        +schema: ancillary
        +tags: [refresh_1h, layer_mart]

      kontali:
        +materialized: table
        +schema: kontali

      ifs:
        +materialized: table
        +schema: ifs
        +tags: [refresh_4h, layer_mart]

      concur:
        +materialized: table
        +schema: concur
        +tags: [refresh_4h, layer_mart]

      cpm:
        fishtalk:
          +materialized: table
          +schema: cpm_fishtalk

          +tags:
            - "CPM"
            - "Onestream"
            - "CPM-Onestream"
            - "Fishtalk"
        sage:
          +materialized: table
          +schema: cpm
          +tags:
            - "CPM"
            - "Onestream"
            - "CPM-Onestream"
            - "Seajoy"
            - layer_mart
            - refresh_1h
        sap:
          cooke-europe:
            +materialized: view
            +schema: cpm
            +tags: ["CPM", "Onestream", "CPM-Onestream", "Cooke Europe", "Morubel"]

          slade-gorton:
            +materialized: view
            +schema: cpm

            +tags:
              - "CPM"
              - "Onestream"
              - "CPM-Onestream"
              - "Slade Gorton"

      d365-cff:
        +materialized: view
        +schema: d365

      d365:
        +materialized: view
        +schema: d365

      boomi_process_reporting:
        +materialized: table
        +schema: boomi_process_reporting

      global_sales_dev:
        global:
          +materialized: table
          +schema: global_dev

      global_sales:
        ancillary:
          +materialized: table
          +schema: ancillary
          +tags: [refresh_1h, layer_mart]

        global:
          +materialized: table
          +schema: global_sales_global
          +tags: ["Global_Sales", refresh_1h, layer_mart]

        d365:
          +materialized: table
          +schema: global_sales_d365
          +tags: ["D365", "Global_Sales", refresh_1h, layer_mart]

        northscope:
          +materialized: table
          +schema: global_sales_northscope
          +tags: ["Northscope", "Global_Sales", refresh_1h, layer_mart]

      global_inventory:
        global:
          +materialized: table
          +schema: global_inventory_global
          +tags: [refresh_1h, layer_mart, "Global Inventory"]

      d365-crm:
        +materialized: table
        +tags: ["D365-CRM"]

      innova_fbd_qcimages:
        +materialized: table
        +schema: fbd_qcscanner_innova
        +tags: ["QC scanner images"]

      edi:
        +materialized: table
        +schema: edi
        +tags: [refresh_1h, layer_mart]

      it_erequester:
        +materialized: table
        +schema: it_erequester

      corporate_safety:
        +materialized: table
        +schema: corporate_safety

      cooke_dev:
        edi_856:
          +materialized: table
          +schema: edi_856_dev_sb1

      tn_fresh_yield_reporting:
        +materialized: table
        +schema: tn_fresh_yield_reporting
        +tags: [refresh_4h, layer_mart]

      gp:
        +materialized: table
        +schema: gp

      navision:
        +materialized: view
        +secure: true
        +schema: navision

      global_procurement:
        +materialized: table
        +schema: global_procurement
        +tags: [refresh_4h, layer_mart]

      urnerberry:
        +materialized: table
        +schema: urnerberry

      it:
        fivetran:
          +materialized: table
          +schema: fivetran

        snowflake:
          +materialized: table
          +schema: snowflake

        powerbi:
          +materialized: table
          +schema: powerbi_usage_metrics

        ardoq:
          +materialized: table
          +schema: ardoq

        monday_resource_management:
          +materialized: table
          +schema: it
          +tags: [monday, resource_planning, layer_mart, it, refresh_4h]

      bioriginal:
        +materialized: table
        +schema: bioriginal
        +tags: [refresh_4h, layer_mart]

      sharepoint:
        +materialized: table
        +schema: sharepoint
        +tags: [refresh_4h, layer_mart]

      pronto_forms:
        nni:
          +materialized: table
          +schema: nni
          +tags: [refresh_10m, layer_mart]

        health_and_safety:
          +materialized: table
          +schema: health_and_safety

      finance:
        d365_invoice_line_detail:
          +materialized: table
          +schema: D365_Invoice_Line_Detail

        d365_account_recievables:
          +materialized: table
          +schema: d365_account_recievables

        global_account_payables:
          +materialized: table
          +schema: global_account_payables

        cpm:
          sage-100:
            +materialized: view
            +schema: sage

        d365_main_account_balances:
          +materialized: table
          +schema: d365_main_account_balances

        global_vendor_spend:
          +materialized: table
          +schema: global_vendor_spend

        dim_finance:
          +materialized: table
          +schema: global_dimensions
          +tags: [refresh_4h, layer_mart]

        metaviewer_payables:
          +materialized: table
          +schema: metaviewer_account_payables
          +tags: [refresh_1h, layer_mart]

        gp_account_payables:
          +materialized: table
          +schema: gp_account_payables

        gp_account_receivables:
          +materialized: table
          +schema: gp_account_receivables

      saltwater:
        scale_aq:
          +materialized: table
          +schema: farming
          +tags: [refresh_10m, layer_mart, saltwater, scale_aq]

        pronto_forms:
          +materialized: table
          +schema: timesheet
          +tags: [pronto_forms, saltwater]

        biological_inventory:
          +materialized: table
          +schema: farming
          +tags: [farming, saltwater]

        dim_farming:
          +materialized: table
          +schema: dim_farming
          +tags: [farming, saltwater]


      - name: cost_centre
        description: Cost centre associated with the transaction.
      - name: product_line
        description: Product line associated with the transaction.
      - name: company_relationship
        description: Company relationship identifier for the transaction.
      - name: account_description
        description: Description of the account associated with the transaction.
      - name: main_account_description
        description: Description of the main account related to the transaction.
      - name: cost_centre_description
        description: Description of the cost centre associated with the transaction.
      - name: department_description
        description: Description of the department involved in the transaction.
      - name: division_description
        description: Description of the division related to the transaction.
      - name: location_description
        description: Description of the location of the transaction.
      - name: product_line_description
        description: Description of the product line associated with the transaction.
      - name: cash_flow_description
        description: Description of the cash flow category related to the transaction.
      - name: company_relationship_description
        description: Description of the company relationship identifier for the transaction.
      - name: customer_vendor_id

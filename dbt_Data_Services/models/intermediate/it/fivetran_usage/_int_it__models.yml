version: 2

models:
  - name: int_fivetran__connectors_joined
    description: Collects connector information, types, creation date from different tables

  - name: int_fivetran__incremental_rows
    description: includes count of number of rows added by each connector till date

  - name: int_fivetran__latest_syncs
    description: It captures the latest sync information, number of rows added along with the basic connector info

  - name: int_fivetran__destination
    description: it houses the destination info, country, and region

  - name: int_fivetran__usage_cost
    description: includes the monthly usage cost by company

  - name: int_fivetran__no_mar
    description: includes all the connectors without any mar

  - name: int_fivetran__monthly_summary
    description: includes monthly summary of all the syncs per connector

version: 2

models:
  - name: sage_100_cpm__v_ber_gl_transactions
    description: "Sage 100 CPM general ledger transactions mart for the BER entity."
    columns:
      - name: surrogate_key
        description: "Surrogate key uniquely identifying each GL transaction line, generated from transaction date, journal entry number, account number, and transaction amount."
        tests:
          - not_null
          - unique


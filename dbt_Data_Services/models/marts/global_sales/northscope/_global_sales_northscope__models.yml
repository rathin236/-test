  - name: dim_account_salesperson_ns
    description: >
      "Dimension table of Northscope account salesperson. This dimension provides
      the salesperson for the Northscope customer account."
    columns:
      - name: InvoiceCustomer_Number
        quote: true
        description: "Primary key for the customer or invoice account"

      - name: Salespersons Name
        quote: true
        description: "The name of the salesperson"

      - name: Create Date
        quote: true
        description: "Create date for the salesperson"

      - name: SOURCESYSTEM
        quote: true
        description: "Name of the source system"

      - name: flag_most_recent
        quote: true
        description: "Flag identifying if the salesperson has expired"

  - name: dim_cust_external_item
    description: This model consolidates customer external item data from multiple source systems, providing a unified view of customer-specific item identifiers and descriptions. It is useful for understanding how items are referenced and described by different customers across various systems.
    columns:
      - name: sourcesystem
        description: The source system from which the data was extracted.
      - name: company
        description: The name of the company associated with the item.
      - name: item_id
        description: The unique identifier for the item.
      - name: customer_external_item_id
        description: The identifier used by the customer for the item.
      - name: customer_external_item_description
        description: The description of the item as provided by the customer.
      - name: sk_item_global
        description: The surrogate key for the global item.
      - name: cust_external_item_pk
        description: The primary key for the customer external item.
        tests:
          - unique
          - not_null

  - name: fact_cost_ns
    description: >
      "Fact table of sales order items in Northscope, with costing information added.
      This table has the same structure as `fact_cost_d365` and can be unioned together"
    columns:
      - name: Order ID
        quote: true
        description: "The ID of the order"

      - name: inventtransid
        description: "D365 field only. Added for unioning purposes"

      - name: Company
        quote: true
        description: "The name of the company"

      - name: Release Status
        quote: true
        description: "D365 field only. Added for unioning purposes"

      - name: Order Status ID
        quote: true
        description: "The ID of the order status. See `dim_order_status` for details"

      - name: Sales Status ID
        quote: true
        description: "Identifier representing the current sales status of the order (e.g., Open, Invoiced, Closed)."

      - name: Sales Type ID
        quote: true
        description: "Code indicating the sales order type (e.g., Regular, Return, Transfer). Used to categorize sales transactions."

      - name: Location ID
        quote: true
        description: "The surrogate key of the site. See `ERPx_MFSite` for details"

      - name: Inventory Location ID
        quote: true
        description: >
          "The surrogate key of the site. See `ERPx_MFSite` for details.
          D365 defines multiple fields for this, Northscope does not. Therefore,
          I used the `sitesk` from `ERPx_MFSite` for this field."

      - name: Inventory Site ID
        quote: true
        description: >
          "The surrogate key of the site. See `ERPx_MFSite` for details.
          D365 defines multiple fields for this, Northscope does not. Therefore,
          I used the `sitesk` from `ERPx_MFSite` for this field."

      - name: Payment
        quote: true
        description: "Terms of payment"

      - name: Create Date
        quote: true
        description: "The date the sales order line item was created"

      - name: Delivery Date
        quote: true
        description: "Delivery date of items on the sales order"

      - name: Invoice Account
        quote: true
        description: "The account number tied to the customer’s billing or invoicing details."

      - name: Customer Invoice Date
        quote: true
        description: "The date when the invoice was created and sent to the customer."

      - name: Customer Account
        quote: true
        description: "Account ID for the customer"

      - name: Delivery Name
        quote: true
        description: "Name of the delivery address"

      - name: Shipping Date Confirmed
        quote: true
        description: "The date when the shipment was confirmed in the system as ready or completed."

      - name: Shipping Date Requested
        quote: true
        description: "Shipping date requested by the customer"

      - name: Modified By
        quote: true
        description: "The last user to modify the sales order line items in Northscope"

      - name: Modified Date
        quote: true
        description: "The date the sales order line items were last modified in Northscope"

      - name: Item ID
        description: "The unique ID of the item. See `ERPx_IMItem`, `item_attribute_values` or `dim_item_ns`"
        quote: true

      - name: Remaining Sales Physical
        quote: true
        description: "The remaining physical quantity of items yet to be invoiced or shipped for the sales order."

      - name: Sales Amount
        quote: true
        description: "The sales dollar value"

      - name: Sales Price
        quote: true
        description: "The unit selling price of the item on the sales order line."

      - name: Invoice Amount
        quote: true
        description: "The invoiced dollar value"

      - name: Sales Qty
        quote: true
        description: "The total number of product units sold or fulfilled for the sales order line."

      - name: Sales Volume (lbs)
        quote: true
        description: "The total volume of sold items expressed in pounds (Lbs)."

      - name: Invoice Volume (lbs)
        quote: true
        description: "The total invoiced weight of items expressed in pounds (Lbs)."

      - name: Inv Qty
        quote: true
        description: "The total quantity of units included in the final customer invoice."

      - name: Inv UOM
        quote: true
        description: "The unit of measure used for the invoiced quantity (e.g., LB, KG, CASE)."

      - name: Sales UOM
        quote: true
        description: "The unit of measure used for sales transactions (e.g., LB, KG, CASE)."

      - name: Sourcing Vendor Account
        quote: true
        description: "The vendor account used for sourcing or purchasing items sold in the sales order."

      - name: Flag_Price_Adjustment
        quote: true
        description: "Indicates whether a manual or system-based price adjustment was applied to the sales order line."

      - name: Invoice ID
        description: "The ID of the invoice"
        quote: true

      - name: Estimated Cost
        quote: true
        description: >
          "The estimated cost of the item to Cooke"

      - name: Posted Cost
        quote: true
        description: "The posted cost of the item to Cooke"

      - name: Adjusted Cost
        quote: true
        description: "Represents any cost adjustments applied after posting, including corrections or revaluations."

      - name: Settled Cost
        quote: true
        description: "The settled cost of the item to Cooke"

      - name: Rebates
        quote: true
        description: "The total rebate amount or discount applied to the sales order or line item."

      - name: Currency
        quote: true
        description: "The currency"

      - name: Returned Invoice
        quote: true
        description: "Indicates whether the invoice was reversed or returned (e.g., due to customer return or correction)."

      - name: Date Financial
        quote: true
        description: "The invoice date"

      - name: Financial Division ID
        quote: true
        description: >
          "Corresponds to the `dataentitycompanysk` in `ERPx_MFDataEntityCompany`. Also see `dim_company_ns`"

      - name: Delivery Address ID
        quote: true
        description: "Identifier for the delivery address associated with the sales order shipment."

      - name: Mode
        quote: true
        description: "Specifies the transportation or delivery mode (e.g., Truck, Air, Sea)."

      - name: Last Data Refresh
        quote: true
        description: "The timestamp of the most recent data load or refresh into the data warehouse."

      - name: Exchange Rate (USD-CAD)
        quote: true
        description: >
          "The exchange rate corresponding to the invoice date for US dollars to Canadian dollars"

      - name: Valid From (USD-CAD)
        quote: true
        description: "Date the exchange rate is valid from"

      - name: Valid To (USD-CAD)
        quote: true
        description: "Date the exchange rate is valid to"

      - name: pk_global_sales
        description: "Primary/Unique Identifier of the table"
        tests:
          - not_null
          - unique


version: 2

models:
  - name: d365_crm_v_products
    description: ""
    columns:
      - name: status
        description: "Import Status either NEW-to be imported as new row, UPDATE-exist but needs update, EXIST-no
        changes needed"
      - name: source
        description: "The data source`s system"
      - name: company
        description: "Company"
      - name: productstructure
        description: "For sales products, should be PRODUCT. For attributes, should be PRODUCT FAMILY"
      - name: producttype
        description: "Defaulted to Sales Inventory"
      - name: productid
        description: "Defaulted to source system Product ID"
      - name: productdesc
        description: "Product description"
      - name: unitgroup
        description: "Unit of measure schedule for the product"
      - name: unit
        description: "Default inventory unit"
      - name: gpproductid
        description: "GP Product ID"
      - name: d365productid
        description: "D365 Product ID"
      - name: crmproductid
        description: "CRM Product ID"
      - name: uomscheduleid
        description: "The Unit Of Measure Schedule ID"
      - name: uomid
        description: "The Unit of Measure ID"
      - name: companyid
        description: "The Company ID"

  - name: d365_crm__v_product_price_lists
    description: "This is a view for both D365 and CRM which determine if the unit group exist in CRM and if
    has to be created as NEW. No UPDATES needed."
    columns:
      - name: status
        description: "Import Status either NEW-to be imported as new row, EXIST-no changes needed, no UPDATE needed"
      - name: source
        description: "This is for CRM only"
      - name: company
        description: "Company"
      - name: pricelist
        description: "This is the both the USD and CAD Price list UID"
      - name: pricelistid
        description: "The id of the price list"
      - name: unit
        description: "Default unit, this is UID of the unit"
      - name: amount
        description: "Amount which should be defaulted to 0"
      - name: currency
        description: ""
      - name: quantsellopt
        description: "Quantity Selling Option which should be defaulted to 'No Control'"
      - name: roundpolicy
        description: "Rounding Policy which should be defaulted to 'None'"
      - name: productuid
        description: ""
      - name: uomscheduleid
        description: ""
      - name: productid
        description: "Defaulted to source system Product ID"

  - name: d365_crm__v_product_unit_groups
    description: "This is a view for both D365 and CRM which determine if the unit group exist in CRM and if
    has to be created as NEW. No UPDATES needed."
    columns:
      - name: status
        description: "Import Status either NEW-to be imported as new row, EXIST-no changes needed, no UPDATE needed"
      - name: source
        description: "The data source`s system"
      - name: productid
        description: "Defaulted to source system Product ID"
      - name: baseunitname
        description: "Defaulted unit. Concatenated default unit and ProductID connected by -"
      - name: description
        description: "Defaulted to 'D365 Product Unit Group'"
      - name: uomscheduleid
        description: ""
      - name: uomid
        description: ""
      - name: company
        description: "Company"
      - name: unitgroupname
        description: "Unit group name. Concatenated default unit and ProductID connected by -"

  - name: d365_crm__v_product_units
    description: "This is a view for both D365 and CRM which determine if the unit group exist in CRM and if
    has to be created as NEW. No UPDATES needed."
    columns:
      - name: uomscheduleeditlink
        description: ""
      - name: status
        description: "Import Status either NEW-to be imported as new row, EXIST-no changes needed, no UPDATE needed"
      - name: source
        description: "The data source`s system"
      - name: company
        description: "Company"
      - name: productid
        description: "Defaulted to source system Product ID"
      - name: unitgroup
        description: "Unit group name. Concatenated default unit and ProductID connected by -"
      - name: baseunit
        description: "Default unit. Concatenated default unit and ProductID connected by -"
      - name: fromunit
        description: "Other unit aside from the base unit"
      - name: tounit
        description: "Default inventory unit. Concatenated default unit and ProductID connected by -"
      - name: conversionfactor
        description: "Conversion factor in D365"

  - name: d365_crm__v_customers
    description: ""

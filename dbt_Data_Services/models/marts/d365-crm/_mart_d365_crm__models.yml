        description: ""
      - name: invoicinganddeliveryonhold
        description: ""
      - name: accountstatus
        description: ""
      - name: currency
        description: ""
      - name: employeeresponsibleid
        description: ""
      - name: employeeresponsible
        description: ""
      - name: paytermid
        description: ""
      - name: street
        description: ""
      - name: city
        description: ""
      - name: state
        description: ""
      - name: county
        description: ""
      - name: zipcode
        description: ""

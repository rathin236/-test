version: 2

models:
  - name: dim_monday__boards
    description: |
      Dimension table for Monday.com Resource Planner boards. Contains metadata about
      each active project board including allocation date ranges and project timeline
      information. This dimension supports resource planning and capacity management
      by tracking which boards are active in the current and next year for strategic
      workforce allocation across IT projects at Cooke.
    columns:
      - name: board_id
        description: |
          Unique identifier for the Monday.com board. Primary key of the dimension.
        tests:
          - not_null
          - unique

      - name: board_name
        description: |
          Name of the board with the 'Resource Planner' suffix removed for cleaner
          display. Represents the project or initiative name being tracked.

      - name: workspace_id
        description: |
          Monday.com workspace identifier. Filtered to workspace 11173027 which
          contains the IT Resource Planner workspace at Cooke.

      - name: board_type
        description: |
          Type of Monday.com object. Always 'board' in this dimension as we filter
          to only include board-type objects.

      - name: board_state
        description: |
          Current state of the board. Always 'active' as we filter to only include
          active boards that are currently being used for resource planning.

      - name: board_start_date
        description: |
          Earliest allocation start date across all resource allocations on the board.
          Represents when work is scheduled to begin on this project. NULL if no valid
          allocations exist.

      - name: board_end_date
        description: |
          Latest allocation end date across all resource allocations on the board.
          Represents when work is scheduled to complete on this project. NULL if no
          valid allocations exist.

      - name: board_duration_days
        description: |
          Total number of calendar days between board_start_date and board_end_date.
          Represents the full duration of the project timeline. NULL if dates are missing.

      - name: spans_current_year
        description: |
          Boolean flag indicating if the board's allocation period includes or spans
          into the next calendar year for active resource planning purposes. Used to
          identify upcoming projects that need resource allocation.

          Logic: TRUE if the board ends in next year or later AND starts in next year
          or earlier. For example, in 2025, this captures all projects that span into
          or start in 2026, enabling proactive resource planning.

      - name: total_allocations
        description: |
          Count of allocation items with valid date ranges on the board. Represents
          how many resource assignments exist for this project. Zero if no valid
          allocations exist.

  - name: dim_monday__users
    description: |
      Dimension table for Monday.com users and roles involved in IT resource planning
      at Cooke. Contains both actual users (employees with Monday.com accounts) and
      role placeholders (generic role entries used for planning purposes when specific
      individuals haven't been assigned yet). This dimension supports capacity planning,
      resource allocation analysis, and workforce management across IT projects.

      The table includes a special union structure where role-only records (without
      specific users) are included to enable planning by job function rather than
      by named individual.
    columns:
      - name: user_sk
        description: |
          Surrogate key generated from hashing user ID and role. Used as the primary
          identifier for joining to fact tables. This key is unique for each user-role
          combination, allowing individuals with multiple roles to be tracked separately.
        tests:
          - not_null
          - unique

      - name: id
        description: |
          Monday.com user ID. Unique identifier for the user in Monday.com. NULL for
          role-only records that represent generic job functions rather than specific
          individuals.

      - name: display_name
        description: |
          Full display name of the user as it appears in Monday.com. NULL for role-only
          records.

      - name: role_id
        description: |
          Unique identifier for the role, generated by hashing the role display value.
          Used to track and group users by their job function or role type.

      - name: default_role
        description: |
          Default job role or job title assigned to the user (e.g., 'Developer',
          'Project Manager', 'Business Analyst'). Used for capacity planning by role
          type and skill set matching.

      - name: default_location
        description: |
          Default work location for the user. Used for understanding geographic
          distribution of resources and managing time zones for resource allocation.

      - name: is_guest
        description: |
          Boolean flag indicating if the user is a guest account rather than a full
          Monday.com user. NULL for role-only records.

      - name: is_enabled
        description: |
          Boolean flag indicating if the user account is currently enabled and active.
          Used to filter out inactive users from capacity planning. NULL for role-only
          records.

      - name: email
        description: |
          Email address of the user in lowercase format. Used for contact and
          notification purposes. NULL for role-only records.

      - name: country_code
        description: |
          Two-letter country code indicating the user's country. Used for understanding
          global resource distribution across Cooke's 14-country operations. NULL for
          role-only records.

      - name: photo_original
        description: |
          URL to the user's original profile photo in Monday.com. Used for UI display
          in reporting dashboards. NULL for role-only records.

      - name: created_at
        description: |
          Timestamp when the user account was created in Monday.com. Used as the
          starting point for capacity calculations (users can only have capacity from
          their creation date forward). For role-only records, defaults to '2025-01-01'.

  - name: fct_monday__allocations
    description: |
      Fact table containing daily resource allocations from Monday.com Resource Planner.
      Each row represents one day of work assigned to a specific user or role on a
      project board. This fact table is the core of Cooke's IT resource planning system,
      tracking how many hours each person or role is allocated to work on each project
      each day. It enables capacity vs. demand analysis, identifies resource conflicts,
      supports project staffing decisions, and provides visibility into resource
      utilization across all IT initiatives.

      The table handles both named resource allocations (specific individuals assigned)
      and role-based allocations (generic role placeholders used for planning before
      specific people are assigned). Weekend days are included but show 0 effort hours.
    columns:
      - name: board_id
        description: |
          Foreign key to dim_monday__boards. Identifies which project board this
          allocation belongs to.
        tests:
          - not_null

      - name: board_name
        description: |
          Name of the project board. Denormalized from the board dimension for
          reporting convenience and query performance.
        tests:
          - not_null

      - name: item_id
        description: |
          Monday.com item ID for the allocation record. Each allocation is stored as
          an item in Monday.com with associated timeline and effort data.

      - name: work_date
        description: |
          The specific calendar date for this allocation. Each allocation is expanded
          into daily records spanning from timeline_start to timeline_end. Includes
          weekends (which have 0 effort hours).

      - name: linkedpulse
        description: |
          Monday.com pulse ID linking this allocation to a specific user's record.
          NULL when the allocation is role-based rather than person-specific.

      - name: assigned_user_placeholder
        description: |
          Monday.com item ID for the role placeholder when no specific user is assigned.
          Used for role-based planning. NULL when a specific user is assigned.

      - name: effort_hours_per_day
        description: |
          Number of hours allocated to this work per day. Typically represents partial
          allocation (e.g., 4 hours = 50% allocation) or full day allocation (7-8 hours).
          Set to 0 for weekends (Saturday/Sunday) regardless of the configured effort.
          NULL if no effort value is configured.

      - name: user_id
        description: |
          Foreign key to dim_monday__users (via the id field). Identifies which specific
          user this allocation belongs to. NULL for role-based allocations.

      - name: resource_name
        description: |
          Display name of the specific person allocated to this work. NULL for role-based
          allocations where only a role placeholder is used.

      - name: role_name
        description: |
          Job role or title for this allocation. For person-specific allocations, this
          is the user's default_role. For role-based allocations, this is the name of
          the role placeholder item.

      - name: user_sk
        description: |
          Foreign key to dim_monday__users. Surrogate key linking to the user/role
          dimension. Generated from the user and role combination, or from hashing
          the role name for role-based allocations.

      - name: fact_monday_allocations_pk
        description: The primary key for the capacity fact, generated using a hash of
          key attributes.
        tests:
          - unique
          - not_null

  - name: fct_monday__capacity
    description: |
      Fact table containing daily capacity hours for all Monday.com users involved in
      IT resource planning at Cooke. Each row represents the available capacity hours
      for a specific user on a specific date. This fact table enables capacity vs.
      allocation analysis, identifies over-allocated resources, supports hiring
      decisions, and provides visibility into available capacity across the IT
      organization.

      Capacity is calculated using a standard 7-hour workday assumption for weekdays,
      with 0 hours on weekends. The table spans from each user's account creation date
      through 2028, providing a long-term planning horizon. Includes both individual
      users and role-based capacity entries.
    columns:
      - name: user_id
        description: |
          Foreign key to dim_monday__users (via the id field). Identifies which user
          this capacity record belongs to. NULL for role-only capacity records.

      - name: role_id
        description: |
          Foreign key to dim_monday__users (via the role_id field). Identifies the role
          associated with this capacity. Used for role-based capacity planning.
        tests:
          - not_null

      - name: user_sk
        description: |
          Foreign key to dim_monday__users. Surrogate key linking to the user/role
          dimension. Matches the user_sk structure in allocations for joining.
        tests:
          - not_null

      - name: user_name
        description: |
          Display name of the user. Denormalized from the user dimension for reporting
          convenience.

      - name: user_email
        description: |
          Email address of the user. Denormalized from the user dimension for reporting
          and filtering purposes.

      - name: user_role
        description: |
          Job role or title of the user. Denormalized from the user dimension for
          grouping and filtering by role type.

      - name: entry_date
        description: |
          The specific calendar date for this capacity record. Spans from the user's
          account creation date through 2028-12-31, providing multi-year planning
          visibility.
        tests:
          - not_null
        meta:
          metrics:
            capacity_date_range:
              type: min_max
              description: Range of dates covered by capacity data

      - name: capacityhours
        description: |
          Available capacity hours for the user on this date. Calculated as 7 hours
          for weekdays (Monday-Friday) representing a standard workday, and 0 hours
          for weekends (Saturday-Sunday). Always 0 if user_id is NULL.

          This standardized capacity allows comparing allocated hours against available
          hours to identify over/under-allocation and resource availability.

      - name: fact_monday_capacity_pk
        description: The primary key for the capacity fact, generated using a hash of
          key attributes.
        tests:
          - unique
          - not_null

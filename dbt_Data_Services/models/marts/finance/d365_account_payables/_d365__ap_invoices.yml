models:
  - name: fct_d365__paid_invoices
    description:
      This model consolidates paid invoice data from the D365 system, providing
      a comprehensive view of financial transactions. It includes details such as transaction
      identifiers, vendor information, document specifics, currency details, and payment
      terms. The model also calculates a global surrogate key for accounts payable using
      a hash of key attributes.
    columns:
      - name: transaction_id
        description: Unique identifier for the transaction.
      - name: company_id
        description: Identifier for the company associated with the transaction.
      - name: vendor_id
        description: Identifier for the vendor involved in the transaction.
      - name: document_type_id
        description: Identifier for the type of document related to the transaction.
      - name: currency_id
        description: Identifier for the currency used in the transaction.
      - name: voucher
        description: Voucher number associated with the transaction.
      - name: bach_number
        description: Batch number for the transaction.
      - name: paymtermid
        description: Identifier for the payment terms of the transaction.
      - name: userid
        description: Identifier for the user who processed the transaction.
      - name: document_number
        description: Number of the document related to the transaction.
      - name: document_date
        description: Date when the document was issued.
      - name: gl_posting_date
        description: Date when the transaction was posted to the general ledger.
      - name: due_date
        description: Date when the payment is due.
      - name: po_number
        description: Purchase order number associated with the transaction.
      - name: company_currency
        description: Currency used by the company for the transaction.
      - name: functional_document_amount
        description: Amount of the document in the company's functional currency.
      - name: functional_transaction_amount
        description: Transaction amount in the company's functional currency.
      - name: originating_document_amount
        description: Original amount of the document in the transaction's currency.
      - name: originating_transaction_amount
        description: Original transaction amount in the transaction's currency.
      - name: cad_amount
        description: Amount in Canadian dollars.
      - name: usd_amount
        description: Amount in US dollars.
      - name: cad_purchase_amount
        description: Purchase amount in Canadian dollars.
      - name: usd_purchase_amount
        description: Purchase amount in US dollars.
      - name: days_to_pay
        description: Number of days taken to make the payment.
      - name: days_to_overdue
        description: Number of days the payment is overdue.
      - name: sk_vendor_global
        description: Surrogate key for the global vendor.
      - name: sk_doctype_global
        description: Surrogate key for the global document type.
      - name: status
        description: Current status of the transaction.
      - name: source_type
        description: Type of source system, set as 'D365'.
      - name: sk_ap_global
        description:
          Global surrogate key for accounts payable, generated by hashing key
          attributes.
        tests:
          - unique
          - not_null

name: "Nightly - YAMLlint Full Repo"

# Scheduled trigger - runs nightly at 2 AM UTC
schedules:
  - cron: "0 2 * * *"
    displayName: "Nightly 2 AM UTC"
    branches:
      include:
        - main
    always: true

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: YAMLLintFull
    timeoutInMinutes: 30
    displayName: 'Lint all .yml files with yamllint'

    workspace:
      clean: outputs

    steps:
      - checkout: self
        fetchDepth: 1
        clean: true

      - script: |
          pip install yamllint
        displayName: Install yamllint

      - script: |
          yamllint --version
          echo "All .yml files in repo:"
          git ls-files | grep '\.yml$'
        displayName: Test yamllint Install, list all .yml files

      - script: |
          echo "Linting all YAML files..."
          yamllint .
        displayName: Lint all .yml files
        continueOnError: false
